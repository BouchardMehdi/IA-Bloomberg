name: market-ai

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-market_ai}
      POSTGRES_USER: ${POSTGRES_USER:-market_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-market_ai} -d ${POSTGRES_DB:-market_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://market_ai:change-me@postgres:5432/market_ai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      INTERNATIONAL_NEWS_ENABLED: ${INTERNATIONAL_NEWS_ENABLED:-true}
      ALERTS_ENABLED: ${ALERTS_ENABLED:-true}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      MARKET_DAILY_REQUEST_BUDGET: ${MARKET_DAILY_REQUEST_BUDGET:-20}
      EARNINGS_CALENDAR_ENABLED: ${EARNINGS_CALENDAR_ENABLED:-true}
      COMPANY_PUBLICATIONS_ENABLED: ${COMPANY_PUBLICATIONS_ENABLED:-true}
      FINANCIAL_RESULTS_ENABLED: ${FINANCIAL_RESULTS_ENABLED:-true}
      WLS_IDENTITY_ENABLED: ${WLS_IDENTITY_ENABLED:-true}
      WLS_AUTO_WATCH_LIMIT: ${WLS_AUTO_WATCH_LIMIT:-20}
      MARKET_MAX_PRICE_AGE_DAYS: ${MARKET_MAX_PRICE_AGE_DAYS:-7}
      MARKET_MAX_FX_AGE_DAYS: ${MARKET_MAX_FX_AGE_DAYS:-7}
      FX_COLLECTION_ENABLED: ${FX_COLLECTION_ENABLED:-true}
      FX_COLLECTION_INTERVAL_MINUTES: ${FX_COLLECTION_INTERVAL_MINUTES:-60}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-600}
      AI_PASSAGE_CHARS: ${AI_PASSAGE_CHARS:-3000}
      AI_MAX_PASSAGES: ${AI_MAX_PASSAGES:-3}
      AI_INPUT_BUDGET_CHARS: ${AI_INPUT_BUDGET_CHARS:-9000}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-MarketAI/0.1 contact@example.com}
      DOCUMENT_COLLECTION_ENABLED: ${DOCUMENT_COLLECTION_ENABLED:-true}
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-2000000}
      DOCUMENT_MAX_CHARS: ${DOCUMENT_MAX_CHARS:-60000}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://market_ai:change-me@postgres:5432/market_ai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      INTERNATIONAL_NEWS_ENABLED: ${INTERNATIONAL_NEWS_ENABLED:-true}
      ALERTS_ENABLED: ${ALERTS_ENABLED:-true}
      ECB_COLLECTION_INTERVAL_MINUTES: ${ECB_COLLECTION_INTERVAL_MINUTES:-15}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      MARKET_DAILY_REQUEST_BUDGET: ${MARKET_DAILY_REQUEST_BUDGET:-20}
      EARNINGS_CALENDAR_ENABLED: ${EARNINGS_CALENDAR_ENABLED:-true}
      COMPANY_PUBLICATIONS_ENABLED: ${COMPANY_PUBLICATIONS_ENABLED:-true}
      FINANCIAL_RESULTS_ENABLED: ${FINANCIAL_RESULTS_ENABLED:-true}
      WLS_IDENTITY_ENABLED: ${WLS_IDENTITY_ENABLED:-true}
      WLS_AUTO_WATCH_LIMIT: ${WLS_AUTO_WATCH_LIMIT:-20}
      MARKET_MAX_PRICE_AGE_DAYS: ${MARKET_MAX_PRICE_AGE_DAYS:-7}
      MARKET_MAX_FX_AGE_DAYS: ${MARKET_MAX_FX_AGE_DAYS:-7}
      FX_COLLECTION_ENABLED: ${FX_COLLECTION_ENABLED:-true}
      FX_COLLECTION_INTERVAL_MINUTES: ${FX_COLLECTION_INTERVAL_MINUTES:-60}
      FED_COLLECTION_INTERVAL_MINUTES: ${FED_COLLECTION_INTERVAL_MINUTES:-15}
      SEC_COLLECTION_INTERVAL_MINUTES: ${SEC_COLLECTION_INTERVAL_MINUTES:-15}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-MarketAI/0.1 contact@example.com}
      EVENT_EXTRACTION_INTERVAL_MINUTES: ${EVENT_EXTRACTION_INTERVAL_MINUTES:-1}
      ENTITY_REGISTRY_ENABLED: ${ENTITY_REGISTRY_ENABLED:-true}
      DOCUMENT_COLLECTION_ENABLED: ${DOCUMENT_COLLECTION_ENABLED:-true}
      DOCUMENT_COLLECTION_INTERVAL_MINUTES: ${DOCUMENT_COLLECTION_INTERVAL_MINUTES:-1}
      DOCUMENT_COLLECTION_BATCH_SIZE: ${DOCUMENT_COLLECTION_BATCH_SIZE:-5}
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-2000000}
      DOCUMENT_MAX_CHARS: ${DOCUMENT_MAX_CHARS:-60000}
      AI_ANALYSIS_ENABLED: ${AI_ANALYSIS_ENABLED:-false}
      AI_ANALYSIS_INTERVAL_MINUTES: ${AI_ANALYSIS_INTERVAL_MINUTES:-5}
      AI_ANALYSIS_BATCH_SIZE: ${AI_ANALYSIS_BATCH_SIZE:-3}
      AI_PASSAGE_CHARS: ${AI_PASSAGE_CHARS:-3000}
      AI_MAX_PASSAGES: ${AI_MAX_PASSAGES:-3}
      AI_INPUT_BUDGET_CHARS: ${AI_INPUT_BUDGET_CHARS:-9000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-600}
      DATA_INBOX_DIRECTORY: ${DATA_INBOX_DIRECTORY:-}
      SCHEDULER_RUN_ON_START: ${SCHEDULER_RUN_ON_START:-true}
    volumes:
      - ./private-data/imports:/imports:ro
    command: ["python", "-m", "app.scheduler.main"]
    init: true
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      API_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  reverse-proxy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  ollama_data:
