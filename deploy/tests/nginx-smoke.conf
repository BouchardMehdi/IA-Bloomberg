events {}
http {
    # Test fixtures inside an isolated container, no real API or published port.
    server {
        listen 127.0.0.1:8088;
        location / { return 200 "front|$request_uri|$http_host"; }
    }
    server {
        listen 127.0.0.1:3008;
        location / { return 200 "api|$request_uri|$http_host|$http_x_forwarded_for|$http_x_forwarded_proto"; }
    }
    include /etc/nginx/conf.d/default.conf;
}
