# Independent local project: no VPS database credentials and no inbound ports.
name: market-ai-local-worker
services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    environment:
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    volumes:
      - local_models:/root/.ollama
    restart: 'no'
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
  worker:
    build:
      context: .
      dockerfile: deploy/worker/Dockerfile
    environment:
      AI_SITE_URL: ${AI_SITE_URL:?Configure AI_SITE_URL in private-data/worker.env}
      AI_WORKER_TOKEN: ${AI_WORKER_TOKEN:?Configure the worker credential}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    init: true
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  local_models:
